<!doctype html>
<html lang="ko">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>K-LEO CHIP · 우주반도체 설계·적용성 시뮬레이터</title>
 <meta name="description" content="64비트 메모리 오류 주입, SECDED·TMR 보호설계와 K-LEO 궤도별 방사선·우주검증·비용을 비교하는 시뮬레이터.">
 <meta name="theme-color" content="#0a1220">
 <style>:root {
  --ink: #162f3c;
  --muted: #5b707b;
  --line: #dbe4e9;
  --paper: #fff;
  --bg: #f2f6f8;
  --nav: #0a1220;
  --brand: #e6392e;
  --brand-hover: #c22a20;
  --brand-light: #fbe7e5;
  --accent: #057b70;
  --accent-light: #e5f6f0;
  --amber: #925709;
  --amber-bg: #fff4de;
  --red: #bd4243;
  --blue: #426bc4;
  --violet: #7a60af;
  --radius: 13px;
  font-family: Inter, 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.55;
  font-synthesis: none;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--bg);
}
button,
input,
select,
textarea {
  font: inherit;
}
button,
a,
input,
select,
textarea {
  touch-action: manipulation;
}
button {
  cursor: pointer;
}
a {
  color: var(--accent);
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
summary:focus-visible {
  outline: 3px solid #2b9eaa;
  outline-offset: 3px;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
svg {
  display: block;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 1.8rem;
  line-height: 1.35;
  letter-spacing: -0.035em;
}
h2 {
  font-size: 1.08rem;
  letter-spacing: -0.015em;
}
h3 {
  font-size: 1rem;
}
small,
.small {
  font-size: 0.875rem;
}
strong {
  font-weight: 650;
}
input,
select,
textarea {
  width: 100%;
  min-width: 0;
  color: var(--ink);
  background: #fff;
  border: 1px solid #c8d5dd;
  border-radius: 7px;
  padding: 0.6rem 0.7rem;
  min-height: 42px;
}
input[type='number'] {
  font-variant-numeric: tabular-nums;
}
input[aria-invalid='true'] {
  border-color: var(--red);
}
textarea {
  min-height: 95px;
  resize: vertical;
  line-height: 1.6;
}
label {
  display: block;
  font-size: 0.875rem;
  font-weight: 550;
}
label > span {
  display: block;
  margin-bottom: 0.38rem;
}
label .help {
  display: block;
  font-size: 0.8rem;
  font-weight: 400;
  color: var(--muted);
  margin-top: 0.4rem;
}
button {
  border: 0;
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 42px;
  padding: 0.55rem 0.9rem;
  border: 1px solid #cbd8df;
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  font-size: 0.875rem;
  font-weight: 600;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover {
  background: #edf3f5;
  text-decoration: none;
}
.btn.primary {
  background: var(--brand);
  border-color: var(--brand);
  color: white;
}
.btn.primary:hover {
  background: var(--brand-hover);
}
.btn.quiet {
  background: transparent;
  border-color: transparent;
  color: var(--muted);
}
.btn.danger {
  color: var(--red);
}
.icon {
  height: 19px;
  width: 19px;
  flex-shrink: 0;
}
.shell {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  min-height: 100vh;
}
.sidebar {
  background: var(--nav);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 30px 16px 22px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex;
  gap: 11px;
  align-items: center;
  margin: 0 13px 38px;
}
.brand .icon {
  height: 30px;
  width: 30px;
  color: var(--brand);
}
.brand strong {
  font-size: 1.25rem;
  letter-spacing: 0.015em;
}
.brand small {
  display: block;
  color: #a6bac5;
  font-size: 0.75rem;
  letter-spacing: 0.07em;
}
.nav-caption {
  font-size: 0.75rem;
  color: #8fa6b3;
  letter-spacing: 0.12em;
  margin: 0 15px 10px;
}
.nav {
  display: grid;
  gap: 7px;
}
.nav button {
  display: flex;
  gap: 11px;
  align-items: center;
  text-align: left;
  color: #b9cbd4;
  background: none;
  padding: 13px 14px;
  border-radius: 8px;
  font-size: 0.92rem;
  min-height: 46px;
}
.nav button:hover {
  background: #1b3745;
  color: #fff;
}
.nav button.active {
  background: #23424f;
  color: #fff;
  box-shadow: inset 3px 0 var(--brand);
}
.nav button.active .icon {
  color: var(--brand);
}
.side-bottom {
  margin-top: auto;
  border-top: 1px solid #2c4350;
  padding: 19px 13px 0;
  color: #adc0c9;
  font-size: 0.8rem;
}
.side-bottom p {
  margin-bottom: 11px;
}
.version {
  font-family: ui-monospace, monospace;
  font-size: 0.75rem;
  color: #82a1af;
}
.main-wrap {
  min-width: 0;
}
.topbar {
  border-bottom: 1px solid var(--line);
  min-height: 65px;
  padding: 0 34px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  background: #fff;
  font-size: 0.875rem;
  color: var(--muted);
}
.topbar strong {
  color: var(--ink);
}
.top-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.top-actions .btn {
  min-height: 36px;
  padding: 0.35rem 0.65rem;
}
.main {
  max-width: 1500px;
  margin: auto;
  padding: 28px 34px 45px;
}
.page-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 22px;
}
.eyebrow {
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  color: var(--accent);
  font-weight: 650;
  margin-bottom: 7px;
}
.subheading {
  color: var(--muted);
  margin-top: 7px;
  font-size: 0.93rem;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  line-height: 1.4;
  padding: 5px 9px;
  border-radius: 5px;
  background: #edf2f5;
  color: #506977;
  white-space: nowrap;
  font-weight: 600;
}
.badge.amber {
  background: var(--amber-bg);
  color: var(--amber);
}
.badge.green {
  background: var(--accent-light);
  color: #086b5c;
}
.badge.red {
  background: #ffeded;
  color: #a12f31;
}
.badge.blue {
  background: #edf1fc;
  color: var(--blue);
}
.notice {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  padding: 13px 16px;
  border: 1px solid #e8d8b6;
  border-radius: 8px;
  background: #fffaef;
  font-size: 0.875rem;
  color: #775320;
  margin-bottom: 20px;
}
.notice .icon {
  margin-top: 1px;
}
.notice.info {
  background: #eef5fa;
  border-color: #d2e2ed;
  color: #405f75;
}
.notice p {
  margin: 0;
}
.notice strong {
  margin-right: 5px;
}
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 19px 22px;
  border-bottom: 1px solid #e6edf1;
}
.card-body {
  padding: 22px;
}
.card-sub {
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 4px;
}
.controls {
  display: grid;
  grid-template-columns: 1.45fr repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 20px;
  padding: 18px 22px;
  align-items: end;
}
.grid-two {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(280px, 1fr);
  gap: 20px;
  margin-top: 20px;
}
.grid-equal {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  margin-top: 20px;
}
.stack {
  display: grid;
  gap: 20px;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.metric {
  padding: 18px 20px;
  position: relative;
}
.metric-label {
  color: var(--muted);
  font-size: 0.85rem;
  display: flex;
  align-items: center;
  gap: 7px;
}
.metric-value {
  font-family: Inter, system-ui, sans-serif;
  font-variant-numeric: tabular-nums;
  font-size: 1.7rem;
  line-height: 1.25;
  letter-spacing: -0.04em;
  margin-top: 11px;
  white-space: nowrap;
  font-weight: 650;
}
.metric-value small {
  font-size: 0.78rem;
  margin-left: 5px;
  font-family: inherit;
  letter-spacing: 0;
  font-weight: 400;
  color: var(--muted);
}
.metric-foot {
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 9px;
}
.metric:first-child:before {
  content: '';
  height: 3px;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  background: var(--accent);
}
.metric-foot.amber,
.text-amber {
  color: var(--amber);
}
.text-red {
  color: var(--red);
}
.text-green {
  color: var(--accent);
}
.text-muted {
  color: var(--muted);
}
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 17px;
  font-size: 0.8rem;
  color: var(--muted);
}
.legend span {
  display: flex;
  align-items: center;
  gap: 6px;
}
.swatch {
  height: 3px;
  width: 20px;
  background: var(--accent);
}
.chart-wrap {
  padding: 12px 18px 5px;
}
.chart {
  width: 100%;
  height: auto;
  overflow: visible;
}
.chart text {
  font-family: inherit;
  font-size: 13px;
  fill: #647984;
}
.chart .axis-title {
  font-size: 12px;
}
.chart-caption {
  font-size: 0.8rem;
  color: var(--muted);
  padding: 0 22px 20px;
}
.kv {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 20px;
  font-size: 0.9rem;
  padding: 10px 0;
  border-bottom: 1px solid #edf2f5;
}
.kv:last-child {
  border: 0;
}
.kv span {
  color: var(--muted);
}
.kv b {
  font-weight: 600;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.part-select {
  font-size: 1rem;
  font-weight: 600;
  margin-top: 14px;
  margin-bottom: 12px;
}
.part-description {
  font-size: 0.85rem;
  color: var(--muted);
  line-height: 1.65;
}
.table-wrap {
  overflow-x: auto;
}
table {
  border-collapse: collapse;
  width: 100%;
  text-align: left;
  font-size: 0.875rem;
}
th {
  background: #f7fafb;
  color: #647984;
  font-weight: 550;
  padding: 12px 18px;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 15px 18px;
  border-bottom: 1px solid #e7eef2;
  vertical-align: middle;
}
tbody tr:last-child td {
  border-bottom: 0;
}
td.number {
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
tr.selected {
  background: #edf8f5;
}
tr.clickable {
  cursor: pointer;
}
tr.clickable:hover {
  background: #f2f8fa;
}
td .secondary {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  margin-top: 4px;
}
.table-note {
  font-size: 0.8rem;
  color: var(--muted);
  padding: 13px 22px;
  border-top: 1px solid var(--line);
}
.field-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 17px;
}
.field-grid.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.full {
  grid-column: 1/-1;
}
.spaced {
  margin-top: 20px;
}
.pill-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.segmented {
  display: flex;
  background: #edf2f5;
  padding: 4px;
  border-radius: 9px;
  gap: 4px;
}
.segmented button {
  flex: 1;
  padding: 10px 13px;
  border-radius: 7px;
  background: transparent;
  color: var(--muted);
  font-size: 0.875rem;
}
.segmented button.active {
  background: #fff;
  box-shadow: 0 1px 5px #1737451a;
  color: var(--accent);
  font-weight: 650;
}
.explain {
  font-size: 0.875rem;
  color: var(--muted);
  line-height: 1.75;
}
.explain p + p {
  margin-top: 10px;
}
.explain ul {
  margin: 10px 0;
  padding-left: 20px;
}
.explain li + li {
  margin-top: 6px;
}
.bar-row {
  display: grid;
  grid-template-columns: 115px 1fr 95px;
  gap: 12px;
  align-items: center;
  font-size: 0.85rem;
  margin: 20px 0;
}
.bar {
  height: 11px;
  border-radius: 3px;
  background: #e9eff2;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  background: var(--accent);
  min-width: 0;
  border-radius: 3px;
}
.bar-row b {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.tasks {
  display: grid;
  gap: 0;
}
.task {
  padding: 18px 22px;
  display: grid;
  grid-template-columns: 82px minmax(0, 1fr) 88px;
  gap: 15px;
  border-bottom: 1px solid #e7eef2;
  align-items: start;
}
.task:last-child {
  border: 0;
}
.task p {
  font-size: 0.875rem;
  color: var(--muted);
  margin-top: 5px;
}
.task select {
  font-size: 0.875rem;
  padding: 0.45rem;
  min-height: 36px;
}
.task .badge {
  justify-content: center;
  margin-top: 2px;
}
.empty {
  color: var(--muted);
  padding: 35px;
  text-align: center;
  font-size: 0.9rem;
}
.empty strong {
  display: block;
  font-size: 1rem;
  color: var(--ink);
  margin-bottom: 9px;
}
.source-list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.source-list li {
  padding: 14px 0;
  border-bottom: 1px solid #e7eef2;
}
.source-list li:first-child {
  padding-top: 0;
}
.source-list li:last-child {
  border: 0;
  padding-bottom: 0;
}
.source-list a {
  font-size: 0.9rem;
  font-weight: 600;
}
.source-list p {
  color: var(--muted);
  font-size: 0.8rem;
  margin-top: 4px;
}
.download-box {
  padding: 20px;
  border: 1px dashed #b9ccd7;
  border-radius: 10px;
  background: #f7fafb;
  margin: 16px 0;
}
.download-box p {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 13px;
}
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 9px;
}
.footer {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  font-size: 0.75rem;
  color: #738a95;
  margin-top: 28px;
}
.formula {
  font-family: ui-monospace, SFMono-Regular, monospace;
  font-size: 0.85rem;
  background: #eff4f6;
  border-radius: 7px;
  padding: 13px;
  overflow-x: auto;
  white-space: normal;
  margin: 10px 0;
}
details.method {
  border-top: 1px solid var(--line);
  padding: 17px 0;
}
details.method:last-child {
  padding-bottom: 0;
}
details.method:first-child {
  border: 0;
  padding-top: 0;
}
summary {
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}
.method .explain {
  margin-top: 12px;
}
.skip-link {
  position: absolute;
  top: -80px;
  left: 10px;
  z-index: 100;
  background: white;
  padding: 12px;
}
.skip-link:focus {
  top: 10px;
}
.boot {
  padding: 60px;
}
.boot strong {
  font-size: 1.5rem;
}
.boot p {
  margin-top: 12px;
  color: var(--muted);
}
#toast {
  position: fixed;
  bottom: 26px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  color: #fff;
  background: #173743;
  padding: 13px 22px;
  border-radius: 9px;
  max-width: min(600px, 90vw);
  box-shadow: 0 6px 30px #0002;
  font-size: 0.9rem;
}
#toast.error {
  background: #a02d37;
}
#print-root {
  display: none;
}
.selected-tag {
  font-size: 0.72rem;
  color: var(--accent);
  margin-left: 6px;
}
.chip-mini {
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #e8f3f2;
  border-radius: 8px;
  color: var(--accent);
}
.row-heading {
  display: flex;
  gap: 10px;
  align-items: center;
}
.count {
  font-size: 0.75rem;
  padding: 2px 8px;
  background: #eaf0f4;
  border-radius: 20px;
  color: var(--muted);
  margin-left: 6px;
}
.input-note {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 14px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
}
@media (min-width: 1650px) {
  .main {
    padding-top: 34px;
  }
  .card-body {
    padding: 25px;
  }
  .metric {
    padding: 22px;
  }
  .metric-value {
    font-size: 2rem;
  }
}
@media (max-width: 1150px) {
  .shell {
    grid-template-columns: 200px minmax(0, 1fr);
  }
  .sidebar {
    padding-left: 10px;
    padding-right: 10px;
  }
  .main {
    padding: 24px;
  }
  .topbar {
    padding: 0 24px;
  }
  .brand {
    margin-left: 8px;
    margin-right: 8px;
  }
  .brand strong {
    font-size: 1.1rem;
  }
  .metrics {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .grid-two {
    grid-template-columns: 1fr;
  }
  .field-grid.three {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 800px) {
  .shell {
    display: block;
  }
  .sidebar {
    height: auto;
    position: relative;
    padding: 16px 18px 0;
  }
  .brand {
    margin: 0 0 15px;
  }
  .brand small {
    display: none;
  }
  .side-bottom,
  .nav-caption {
    display: none;
  }
  .nav {
    display: flex;
    overflow-x: auto;
    gap: 2px;
    padding-bottom: 9px;
  }
  .nav button {
    white-space: nowrap;
    padding: 10px 12px;
    min-height: 42px;
    font-size: 0.85rem;
    gap: 7px;
  }
  .nav button.active {
    box-shadow: inset 0 -2px var(--brand);
  }
  .nav .icon {
    width: 16px;
    height: 16px;
  }
  .topbar {
    padding: 10px 18px;
    min-height: 52px;
  }
  .topbar .crumb {
    display: none;
  }
  .top-actions {
    margin-left: auto;
    flex-wrap: wrap;
  }
  .main {
    padding: 22px 18px;
  }
  .page-heading {
    align-items: flex-start;
    gap: 10px;
  }
  h1 {
    font-size: 1.5rem;
  }
  .subheading {
    font-size: 0.875rem;

function protectionPage(r) {
