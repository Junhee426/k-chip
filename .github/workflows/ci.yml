name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Committed standalone matches build
        run: |
          if ! cmp -s build/kleo-chip-standalone.html dist/kleo-chip-standalone.html; then
            echo "::error file=dist/kleo-chip-standalone.html::Out of date. Run: python3 scripts/package-source.py"
            exit 1
          fi
      - name: Campaign benchmark (informational)
        continue-on-error: true
        run: npm run bench
